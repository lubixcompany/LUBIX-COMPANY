# docker-compose.dev.yml — Desarrollo local
# Uso: docker compose -f docker-compose.dev.yml up --build
#
# Diferencias con producción:
#  - Backend: --reload habilitado, código montado como volumen
#  - Frontend: servidor Vite (hot-reload), VITE_API_URL apunta directo al backend
#  - No requiere nginx ni build de frontend

version: "3.9"

services:

  minio:
    image: minio/minio:latest
    container_name: lubix-minio-dev
    restart: always
    env_file:
      - ./backend/.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
    volumes:
      - minio_data_dev:/data
    command: server /data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  postgres:
    image: postgres:16
    container_name: lubix-postgres-dev
    restart: always
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: lubix-backend-dev
    restart: always
    ports:
      - "8001:8000"
    # Montar código para hot-reload con --reload
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - ./backend/.env
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: lubix-frontend-dev
    restart: always
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      # Apunta directo al backend (puerto expuesto en el host)
      - VITE_API_URL=http://localhost:8001
    depends_on:
      - backend
    command: pnpm run dev -- --host 0.0.0.0 --port 5173

volumes:
  postgres_data_dev:
  minio_data_dev:
