version: "3.9"

services:
  backend:
    build:
      context: ./lubix-backend
      dockerfile: Dockerfile
    container_name: lubix-backend
    ports:
      - "8001:8000"
    volumes:
      - .:/app
    depends_on:
      - postgres
    env_file:
      - .env
    restart: always
    command: uv run uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  minio:
    image: minio/minio:latest
    container_name: lubix-minio
    restart: always
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"
    volumes:
      - minio_data:/data
    command: server /data

  postgres:
    image: postgres:16
    container_name: lubix-postgres
    restart: always
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  frontend:   
    build: ./lubix-frontend
    container_name: lubix-frontend
    ports:
      - "5174:5174"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - VITE_API_URL=http://backend:8000
    command: pnpm run dev -- --port 5174 --host

volumes:
  postgres_data:
  minio_data:
